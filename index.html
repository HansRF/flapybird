<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Retro</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="gameContainer">
      <h1 class="title">FLAPPY BOT</h1>
      <canvas id="flappyCanvas" width="288" height="512"></canvas>
      <button id="restartBtn">RESTART</button>
      <!-- Pop-up Bucin yang muncul setelah Game Over -->
      <div id="bucinPopup" class="bucin-popup hidden">
        <div class="bucin-content">
          <h2>Nice Try</h2>
          <p id="bucinMessage">Game Over</p>
          <button onclick="closeBucinPopup()">Restart</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
